{% extends "base.html" %}


{% block content %}

<h1>Adicione um novo livro</h1>

<form method="POST" action="{{ url_for('home') }}"
      class="form-adicionar lado-a-lado">
    <input type="text" name="title"
           placeholder="Título do livro" required>
    <button type="submit">Adicionar</button>
</form>

<h1>Livros</h1>

<div class="lista-livros">
    {% for book in books %}
    <div class="livro">
        <span class="titulo">{{ book.title }}</span>

        <form method="POST" action="{{ url_for('update') }}">
            <input type="hidden" name="oldtitle" value="{{ book.title }}">
            <input type="text" name="newtitle" placeholder="{{ book.title }}" required >
            <button type="submit" class="emoji-btn" title="Atualizar">
                ✏️
            </button>
        </form>

        <form method="POST" action="{{ url_for('delete') }}">
            <input type="hidden" name="title" value="{{ book.title }}">
            <button type="submit" class="emoji-btn" title="Excluir">
                🗑️
            </button>
        </form>
    </div>
    {% endfor %}
</div>

{% endblock %}
